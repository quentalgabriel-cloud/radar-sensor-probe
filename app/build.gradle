plugins {
    id 'com.android.application'
}

def signingReady = [
        System.getenv('RADAR_KEYSTORE_PATH'),
        System.getenv('RADAR_KEYSTORE_PASSWORD'),
        System.getenv('RADAR_KEY_ALIAS'),
        System.getenv('RADAR_KEY_PASSWORD')
].every { it != null && !it.isBlank() }

def configValue = { String name ->
    def value = System.getenv(name) ?: ''
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'br.com.radardarede.sensor'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.radardarede.sensor'
        minSdk 28
        targetSdk 35
        versionCode 4
        versionName '0.3.0-connected'
        buildConfigField 'String', 'RADAR_INGEST_ENDPOINT', configValue('RADAR_INGEST_ENDPOINT')
        buildConfigField 'String', 'RADAR_NETWORK_ID', configValue('RADAR_NETWORK_ID')
        buildConfigField 'String', 'RADAR_DEVICE_ID', configValue('RADAR_DEVICE_ID')
        buildConfigField 'String', 'RADAR_DEVICE_SECRET', configValue('RADAR_DEVICE_SECRET')
    }

    signingConfigs {
        release {
            if (signingReady) {
                storeFile file(System.getenv('RADAR_KEYSTORE_PATH'))
                storePassword System.getenv('RADAR_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RADAR_KEY_ALIAS')
                keyPassword System.getenv('RADAR_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingReady) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
