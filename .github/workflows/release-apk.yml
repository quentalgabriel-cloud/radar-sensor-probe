name: Release signed Radar Sensor APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RADAR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RADAR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RADAR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate v0.2 foundation
        run: node scripts/check-foundation.mjs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate release tag and signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          test "$GITHUB_REF_NAME" = "v$VERSION_NAME"
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$RADAR_KEYSTORE_PASSWORD"
          test -n "$RADAR_KEY_ALIAS"
          test -n "$RADAR_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/radar-sensor-release.jks"
          echo "RADAR_KEYSTORE_PATH=$RUNNER_TEMP/radar-sensor-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle --no-daemon :app:lintRelease :app:assembleRelease

      - name: Verify signature and prepare release files
        run: |
          set -euo pipefail
          APK_SOURCE=app/build/outputs/apk/release/app-release.apk
          APK_NAME="radar-sensor-probe-${GITHUB_REF_NAME}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_SOURCE"
          cp "$APK_SOURCE" "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$APK_NAME" \
            "$APK_NAME.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Radar Sensor $GITHUB_REF_NAME"
